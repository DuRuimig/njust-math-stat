播授权，且资料不含个人隐私、考试保密内容或其他不宜公开的信息。</span></label><button class="primary" id="submit-upload" type="submit">提交审核</button><button class="text-button" id="simulate-upload-failure" type="button">模拟提交失败</button><p class="form-status" id="upload-status" role="status" aria-live="polite"></p></form></section>

    <section class="view" id="ask"><div class="topline"><span class="eyebrow">RAG COURSE ASSISTANT</span></div><h1>选课问问 AI</h1><p class="sub">基于课程信息与同学评价回答，并标注来源。</p><div class="chat" style="margin-top:26px"><div class="bubble ai">想选什么课？例如：<br>“有没有给分友好、作业别太多的专业课？”</div><div class="bubble me">想找一门概率相关、老师讲得细的课</div><div class="bubble ai">可以优先看看 <b>概率论与数理统计</b>。现有评价中，“讲解清楚”和“给分友好”出现频率较高；课程为闭卷考核，作业强度评分为 3.1/5。<span class="source">来源：概率论与数理统计 · 38 条评价</span></div></div><div class="askbox"><input id="ask-input" placeholder="输入课程问题" /><button class="send" id="send">发送</button></div></section>

    <section class="view" id="teacher"><div class="topline"><button class="back" data-go="home">‹</button><strong>教师信息</strong></div><div class="card teacher"><div class="avatar">李</div><div><h3>李明远</h3><p>数学与统计学院 · 副教授</p><div class="tags"><span class="tag good">讲解清晰</span><span class="tag">答疑耐心</span></div></div></div><h2>授课体验</h2><article class="card review"><b>匿名同学</b><p>板书逻辑清楚，会把重点题型归纳出来。课堂互动不多，但提问都会认真回答。</p><div class="review-footer"><span>概率论与数理统计</span><span>♡ 22</span></div></article><h2>开设课程</h2><article class="card" data-detail="probability"><div class="course-name">概率论与数理统计</div><div class="meta">2025 秋 · 4.5 分</div></article></section>

    <section class="view" id="profile"><div class="profile"><div class="avatar">杜</div><h2>微信用户</h2><p>数统学院 · 已加入知库</p></div><div class="menu"><button><span>我的评价</span><span>›</span></button><button id="show-favorites"><span>我的收藏</span><span id="favorite-total">0</span></button><button data-go="upload"><span>投稿与纠错</span><span>›</span></button><button id="login"><span>微信登录状态</span><span>已登录</span></button></div><div class="section-title"><h2>我的投稿</h2><button data-go="upload">继续投稿</button></div><div id="submission-list"><p class="sub">还没有投稿资料，贡献一份已授权资料吧。</p></div></section>
    <nav class="nav"><button class="active" data-go="home"><span>⌂</span>首页</button><button data-go="ask"><span>✦</span>问答</button><button data-go="profile"><span>◉</span>我的</button></nav>
  </template></main>
  <div class="toast" id="toast">提示</div>
  <script type="text/plain">
    const views=[...document.querySelectorAll('.view')], nav=[...document.querySelectorAll('.nav button')];
    const courses={
      probability:{id:'probability',title:'概率论与数理统计',teacher:'李明远',term:'2025 秋'},
      analysis:{id:'analysis',title:'数学分析 III',teacher:'王晓琳',term:'2025 秋'}
    };
    let currentCourseId='probability';
    let uploadSubmitting=false;
    const materials=[
      {id:1,courseId:'probability',title:'2024 秋期末试卷及题型回顾',type:'历年试卷',teacher:'李明远',term:'2024 秋',source:'来源：教师授权整理，含题型回顾说明。',downloads:86,favorites:24,status:'审核通过'},
      {id:2,courseId:'probability',title:'随机变量与常用分布课堂课件',type:'课堂课件',teacher:'李明远',term:'2025 秋',source:'来源：任课教师公开课件，已获授权收录。',downloads:132,favorites:47,status:'审核通过'},
      {id:3,courseId:'probability',title:'概率论期末复习笔记',type:'复习笔记',teacher:'李明远',term:'2023 秋',source:'来源：学生原创笔记，经作者授权发布。',downloads:61,favorites:18,status:'审核通过'},
      {id:4,courseId:'analysis',title:'数学分析 III 极限与连续复习笔记',type:'复习笔记',teacher:'王晓琳',term:'2025 秋',source:'来源：学生原创笔记，经作者授权发布。',downloads:42,favorites:15,status:'审核通过'},
      {id:5,courseId:'probability',title:'章节习题整理',type:'复习笔记',teacher:'李明远',term:'2025 秋',source:'来源：待确认。',downloads:0,favorites:0,status:'待审核'}
    ];
    const submissions=[];
    const savedMaterials=new Set();
    function updateCourseContext(){
      const course=courses[currentCourseId];
      document.getElementById('detail-title').textContent=course.title;
      document.getElementById('detail-teacher').textContent=`任课教师：${course.teacher}`;
      document.getElementById('detail-term').textContent=course.term;
      document.getElementById('materials-title').textContent=course.title;
      document.getElementById('upload-course').value=course.id;
      document.getElementById('upload-teacher').value=course.teacher;
    }
    function go(id){ views.forEach(v=>v.classList.toggle('active',v.id===id)); nav.forEach(b=>b.classList.toggle('active',b.dataset.go===id)); window.scrollTo(0,0); if(id==='detail'||id==='materials'||id==='upload') updateCourseContext(); if(id==='materials') renderMaterials(); if(id==='profile') renderSubmissions(); }
    document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
    document.querySelectorAll('[data-detail]').forEach(el=>el.addEventListener('click',()=>{ if(el.dataset.detail==='teacher') go('teacher'); else { currentCourseId=el.dataset.courseId; go('detail'); } }));
    document.getElementById('course-search').addEventListener('keydown',e=>{if(e.key==='Enter') go('ask')});
    const modal=document.getElementById('review-modal'),toast=document.getElementById('toast');
    document.getElementById('open-review').onclick=()=>modal.classList.add('show'); document.getElementById('close-review').onclick=()=>modal.classList.remove('show');
    document.getElementById('submit-review').onclick=()=>{ modal.classList.remove('show'); document.getElementById('review-text').value=''; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),2200); };
    document.getElementById('send').onclick=()=>{ const input=document.getElementById('ask-input'); if(!input.value.trim()) return; const bubble=document.createElement('div'); bubble.className='bubble me'; bubble.textContent=input.value; document.querySelector('.chat').append(bubble); input.value=''; setTimeout(()=>{const reply=document.createElement('div');reply.className='bubble ai';reply.innerHTML='我会结合课程资料和同学评价继续检索。这一版原型先展示了可溯源回答的交互形态。<span class="source">来源：课程知识库</span>';document.querySelector('.chat').append(reply);},350); };
    function showToast(message){ toast.textContent=message; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),2200); }
    function renderMaterials(){
      const type=document.getElementById('type-filter').value;
      const teacher=document.getElementById('teacher-filter').value;
      const term=document.getElementById('term-filter').value;
      const visible=materials.filter(item=>item.courseId===currentCourseId&&item.status==='审核通过'&&(!type||item.type===type)&&(!teacher||item.teacher===teacher)&&(!term||item.term===term));
      document.getElementById('result-count').textContent=`${visible.length} 份可用资料`;
      document.getElementById('material-list').innerHTML=visible.length ? visible.map(item=>`<article class="card resource-card"><div class="row"><div><div class="resource-title">${item.title}</div><div class="meta">${item.type} · ${item.teacher} · ${item.term}</div></div><span class="status approved">已审核</span></div><p class="resource-source">${item.source}</p><div class="resource-footer"><span>⇩ ${item.downloads} · ♡ ${item.favorites}</span><div class="resource-actions"><button class="mini-action ${savedMaterials.has(item.id)?'saved':''}" data-save="${item.id}">${savedMaterials.has(item.id)?'已收藏':'收藏'}</button><button class="mini-action" data-download="${item.id}">下载</button></div></div></article>`).join('') : '<p class="sub" style="padding:24px 2px">没有符合条件的已审核资料，试试清空筛选。</p>';
      document.querySelectorAll('[data-save]').forEach(button=>button.onclick=()=>{
        const id=Number(button.dataset.save); const item=materials.find(material=>material.id===id);
        if(savedMaterials.has(id)){ savedMaterials.delete(id); item.favorites--; showToast('已取消收藏'); } else { savedMaterials.add(id); item.favorites++; showToast('已收藏到个人中心'); }
        document.getElementById('favorite-total').textContent=savedMaterials.size; renderMaterials();
      });
      document.querySelectorAll('[data-download]').forEach(button=>button.onclick=()=>{
        const item=materials.find(material=>material.id===Number(button.dataset.download)); item.downloads++; showToast(`已记录《${item.title}》的下载意向（静态原型未生成文件）`); renderMaterials();
      });
    }
    ['type-filter','teacher-filter','term-filter'].forEach(id=>document.getElementById(id).addEventListener('change',renderMaterials));
    document.getElementById('clear-filters').onclick=()=>{ ['type-filter','teacher-filter','term-filter'].forEach(id=>document.getElementById(id).value=''); renderMaterials(); };
    document.getElementById('upload-file').addEventListener('change',event=>{ const file=event.target.files[0]; document.getElementById('file-name').textContent=file ? file.name : '支持 PDF、Word、PPT、ZIP'; });
    function setUploadState(message,isError=false){ const status=document.getElementById('upload-status'); status.textContent=message; status.classList.toggle('error',isError); }
    function setUploadSubmitting(isSubmitting){ uploadSubmitting=isSubmitting; const submit=document.getElementById('submit-upload'); submit.disabled=isSubmitting; submit.textContent=isSubmitting?'模拟提交中...':'提交审核'; }
    document.getElementById('simulate-upload-failure').onclick=()=>{
      if(uploadSubmitting) return;
      setUploadState('模拟提交失败：网络不可用。已保留当前填写内容，请稍后重试。',true);
    };
    document.getElementById('upload-form').addEventListener('submit',event=>{
      event.preventDefault();
      const form=event.currentTarget;
      if(uploadSubmitting) return;
      if(!form.checkValidity()){ form.reportValidity(); return; }
      setUploadSubmitting(true); setUploadState('正在模拟提交投稿，请勿重复操作。');
      setTimeout(()=>{
      const submission={
        title:document.getElementById('upload-file').files[0].name,
        courseId:document.getElementById('upload-course').value,
        course:courses[document.getElementById('upload-course').value].title,
        teacher:document.getElementById('upload-teacher').value,
        term:document.getElementById('upload-term').value,
        type:document.getElementById('upload-type').value,
        status:'待审核'
      };
      submissions.unshift(submission); form.reset(); document.getElementById('file-name').textContent='支持 PDF、Word、PPT、ZIP'; setUploadSubmitting(false); setUploadState(''); go('profile'); showToast('资料已提交，等待审核');
      },650);
    });
    function renderSubmissions(){
      const list=document.getElementById('submission-list');
      list.innerHTML=submissions.length ? submissions.map(item=>`<article class="card"><div class="row"><div><div class="submission-title">${item.title}</div><div class="meta">${item.course} · ${item.teacher} · ${item.term}</div></div><span class="status pending">${item.status}</span></div><div class="tags"><span class="tag">${item.type}</span><span class="tag warm">审核完成前不会公开</span></div></article>`).join('') : '<p class="sub">还没有投稿资料，贡献一份已授权资料吧。</p>';
    }
    document.getElementById('show-favorites').onclick=()=>showToast(savedMaterials.size ? `已收藏 ${savedMaterials.size} 份资料` : '暂未收藏资料');
    updateCourseContext(); renderMaterials();
  </script>
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
